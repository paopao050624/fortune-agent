name: Tests and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and build tools
        run: python -m pip install '.[all]' build
      - name: Test without API credentials
        run: |
          python -W error::ResourceWarning - <<'PY'
          import unittest
          def flatten(suite):
              for test in suite:
                  if isinstance(test, unittest.TestSuite):
                      yield from flatten(test)
                  else:
                      yield test
          suite = unittest.TestLoader().discover('tests')
          selected = unittest.TestSuite(t for t in flatten(suite) if t.__class__.__module__ != 'test_web')
          result = unittest.TextTestRunner(verbosity=2).run(selected)
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Build distribution
        run: python -m build
      - name: Check command entry points
        run: |
          fortune-agent --help
          fortune-daily --help
          fortune-report --help
          fortune-bazi --help
          fortune-web --help
          fortune-iching --help
          fortune-chat --help
          fortune-doctor
          fortune-chart --help
          fortune-chart ziwei --birth 2000-01-01T12:00:00+08:00 --gender female
          fortune-chart astrology --birth 2000-01-01T12:00:00+00:00 --timezone Europe/London --latitude 51.4779 --longitude 0
          fortune-iching --reference 1
          fortune-iching --lines 9 9 9 9 9 9
